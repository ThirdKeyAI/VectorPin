[workspace]
resolver = "2"
members = ["vectorpin"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Jascha Wanger / ThirdKey.ai"]
homepage = "https://vectorpin.org"
repository = "https://github.com/ThirdKeyAI/VectorPin"
keywords = ["security", "vector-database", "embeddings", "rag", "integrity"]
categories = ["cryptography", "data-structures"]

[workspace.dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
unicode-normalization = "0.1"
zeroize = "1"
thiserror = "1.0"
hex = "0.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
