[package]
name = "vectorpin"
description = "Verifiable integrity for AI embedding stores."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
rand = "0.8"
zeroize = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "std"] }

[dev-dependencies]
# Tests reuse the same rand version as the crate.
criterion = { workspace = true }

[features]
default = []

[[bench]]
name = "perf"
harness = false

# docs.rs builds the documentation with these settings.
[package.metadata.docs.rs]
all-features = true
